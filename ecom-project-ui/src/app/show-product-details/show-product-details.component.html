<div class="container mt-5 p-3">

  <mat-form-field appearance="outline" class="w-100" floatLabel="always">
    <mat-label>Search any Product  </mat-label>
    <input matInput 
    #searchInput
    (keyup)="searchByKeyword(searchInput.value)"
    name="searchKey" id="searchKey" placeholder="Search any Product" >
    <mat-hint>Search any Product</mat-hint>
</mat-form-field>

  <div *ngIf="showTable">

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
  
    <!-- Product Id Column -->
    <ng-container matColumnDef="productId">
      <th mat-header-cell *matHeaderCellDef>Product Id</th>
      <td mat-cell *matCellDef="let element"> {{element.productId}} </td>
    </ng-container>

    <!-- Product Name Column -->
    <ng-container matColumnDef="productName">
      <th mat-header-cell *matHeaderCellDef>Product Name</th>
      <td mat-cell *matCellDef="let element"> {{element.productName}} </td>
    </ng-container>

    <!-- Product Description Column -->
    <ng-container matColumnDef="productDescription">
      <th mat-header-cell *matHeaderCellDef>Product Description</th>
      <td mat-cell *matCellDef="let element"> {{element.productDescription}} </td>
    </ng-container>

    <!-- Product Discounted Price Column -->
    <ng-container matColumnDef="productDiscountedPrice">
      <th mat-header-cell *matHeaderCellDef>Discounted Price</th>
      <td mat-cell *matCellDef="let element"> {{element.productDiscountedPrice}} </td>
    </ng-container>

    <!-- Product Actual Price Column -->
    <ng-container matColumnDef="productActualPrice">
      <th mat-header-cell *matHeaderCellDef>Actual Price</th>
      <td mat-cell *matCellDef="let element"> {{element.productActualPrice}} </td>
    </ng-container>
<!-- Product Images Column -->
<ng-container matColumnDef="Images">
  <th mat-header-cell *matHeaderCellDef>Images</th>
  <td mat-cell *matCellDef="let element">
    <button mat-icon-button color="primary" (click)="showImages(element)">
      <mat-icon>photo</mat-icon>
    </button>
  </td>
</ng-container>

<!-- Actions Column -->
<ng-container matColumnDef="Actions">
  <th mat-header-cell *matHeaderCellDef>Actions</th>
  <td mat-cell *matCellDef="let element">
    <button mat-icon-button color="warn" (click)="deleteProduct(element.productId)">
      <mat-icon>delete</mat-icon>
    </button>
    <button mat-icon-button color="primary" (click)="editProductDetails(element.productId)">
      <mat-icon>edit</mat-icon>
    </button>
  </td>
</ng-container>


    <!-- Table Rows -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  </div>
<div class="text-center p-5">
<button type="button" mat-raised-button color="primary" (click)="loadMoreProduct()">Load more</button>
</div>
</div>
